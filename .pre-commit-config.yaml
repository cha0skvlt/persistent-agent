repos:
  # Use project venv so hook versions match `make format` / `make lint`.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: venv/bin/python3 -m ruff check --fix
        language: system
        types: [python]

      - id: black
        name: black
        entry: venv/bin/black
        language: system
        types: [python]

      - id: isort
        name: isort
        entry: venv/bin/isort --profile black
        language: system
        types: [python]

  # mypy is not in pre-commit: scripts/ layout triggers duplicate-module errors on
  # `run -a`; the gate is `make typecheck` / CI (`make ci` = lint + typecheck + smoke).

  # PR gate before push (matches .github/workflows/ci.yml).
  - repo: local
    hooks:
      - id: make-ci
        name: make ci (lint + typecheck + env-check + test-pr-smoke)
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && make ci'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
