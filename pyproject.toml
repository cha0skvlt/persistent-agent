[project]
name = "persistent-agent"
version = "1.0.0"
license = { text = "PolyForm-Shield-1.0.0" }
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "unit: pure logic, mocked IO (tests/unit/)",
    "integration: multi-module graph behavior (tests/integration/)",
    "system: API, heart, live stack (tests/system/)",
    "db: requires TEST_DATABASE_URL",
    "live: hits real Ollama HTTP API (opt-in)",
]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
fail_under = 0
show_missing = true

[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = "/(venv|\\.git)/"

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["src"]
skip_gitignore = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# Import sorting is enforced by isort (8B.2); keep ruff focused on correctness + bugbear.
select = ["E", "F", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E402"]
"src/graph/workflow.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
explicit_package_bases = true
ignore_missing_imports = true
warn_return_any = false
disallow_untyped_defs = false
# Gradual typing baseline — tighten as debt is paid down.
disable_error_code = [
    "arg-type",
    "assignment",
    "no-any-return",
    "call-overload",
    "attr-defined",
    "call-arg",
    "var-annotated",
    "exit-return",
]
